 # wedding 子应用
    location /wedding/ {
        alias /www/wwwroot/wedding/;
        index index.html;
        try_files $uri $uri/ /wedding/index.html;
    }

    location = /wedding {
        return 301 /wedding/;
    }

 # weddingManage 子应用
    location /weddingManage/ {
        alias /www/wwwroot/weddingManage/;
        index index.html;
        try_files $uri $uri/ /weddingManage/index.html;
    }

    location = /weddingManage {
        return 301 /weddingManage/;
    }